name: Publish Homzmart HR RC2 QA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-rc2-qa.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-e678-8246-aa38-44042ff8c58c/raw?se=2026-10-03T12%3A18%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=634f226e-92b4-5a39-8823-da64370db7be&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T06%3A08%3A08Z&ske=2026-10-04T06%3A08%3A08Z&sks=b&skv=2026-02-06&sig=qrpSuGbJIo/YNMEUuRbOv0xo%2Bhw8TJ%2BQJ8HZ5IllCus%3D"
      TAG: v1.0.0-rc2-qa
      APK_NAME: Homzmart_HR_Staging_QA_Stitch10.apk

    steps:
      - name: Check out releases repository
        uses: actions/checkout@v4

      - name: Download QA artifact
        run: |
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip
          APK="$(find . -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mv "$APK" "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Publish QA prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
          else
            gh release create "$TAG" "$APK_NAME"               --title "Homzmart HR v1.0.0 RC2 QA"               --prerelease               --notes "Staging QA build with the Stitch Package 10 UI redesign merged into main. For tester validation only. Package: com.homzmart.homezmart_hr. Environment: staging. This is a debug-signed QA APK, not the final signed production release."
          fi
